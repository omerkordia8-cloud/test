<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Portfolio</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="css/theme-light.css" />

  <!-- Apply saved theme before render to avoid flash -->
  <script>
    (function() {
      const t = localStorage.getItem('portfolio_theme');
      if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    })();
  </script>
</head>
<body class="login-body">

  <!-- Animated background layers -->
  <div class="bg-grid"></div>
  <div class="bg-noise"></div>

  <!-- Floating orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Particles canvas -->
  <canvas id="particles-canvas"></canvas>

  <!-- Login wrapper -->
  <main class="login-wrapper">

    <!-- Left panel — branding -->
    <div class="login-brand reveal-left">
      <div class="brand-icon">
        <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon points="30,4 56,18 56,42 30,56 4,42 4,18" stroke="url(#hex-grad)" stroke-width="2" fill="none"/>
          <polygon points="30,14 46,23 46,37 30,46 14,37 14,23" stroke="url(#hex-grad)" stroke-width="1.5" fill="none" opacity="0.5"/>
          <text x="30" y="35" text-anchor="middle" font-family="'Rajdhani',sans-serif" font-size="16" font-weight="700" fill="url(#hex-grad)">OM</text>
          <defs>
            <linearGradient id="hex-grad" x1="0" y1="0" x2="60" y2="60">
              <stop offset="0%" stop-color="#00e5ff"/>
              <stop offset="100%" stop-color="#7b2fff"/>
            </linearGradient>
          </defs>
        </svg>
      </div>

      <h1 class="brand-name">Omar's<br/><span class="gradient-text">Portfolio</span></h1>
      <p class="brand-tagline">// Computer · Programming · Design · 3D</p>

      <div class="brand-stats">
        <div class="stat-item">
          <span class="stat-number gradient-text">10+</span>
          <span class="stat-label">Projects</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-number gradient-text-pink">3+</span>
          <span class="stat-label">Years Exp</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-number gradient-text-green">∞</span>
          <span class="stat-label">Passion</span>
        </div>
      </div>

      <div class="brand-tech-tags">
        <span class="tech-tag">Python</span>
        <span class="tech-tag">JavaScript</span>
        <span class="tech-tag">Blender</span>
        <span class="tech-tag">Adobe</span>
        <span class="tech-tag">C++</span>
        <span class="tech-tag">AI/ML</span>
      </div>
    </div>

    <!-- Right panel — login form -->
    <div class="login-card reveal-right">

      <!-- Card top glow line -->
      <div class="card-glow-line"></div>

      <div class="login-card-inner">
        <div class="login-header">
          <div class="login-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
              <path d="M12 2C9.24 2 7 4.24 7 7s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5z" fill="url(#icon-grad)"/>
              <path d="M12 14c-5.33 0-8 2.67-8 4v1h16v-1c0-1.33-2.67-4-8-4z" fill="url(#icon-grad)"/>
              <defs>
                <linearGradient id="icon-grad" x1="4" y1="2" x2="20" y2="22">
                  <stop offset="0%" stop-color="#00e5ff"/>
                  <stop offset="100%" stop-color="#7b2fff"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <h2 class="login-title">Access Portal</h2>
          <p class="login-subtitle">Enter credentials to continue</p>
        </div>

        <!-- Status message -->
        <div class="login-status" id="loginStatus" aria-live="polite"></div>

        <form class="login-form" id="loginForm" novalidate>
          <!-- Username -->
          <div class="form-group" id="usernameGroup">
            <label class="form-label" for="username">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2"/>
                <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
              </svg>
              Username
            </label>
            <div class="input-wrapper">
              <input
                type="text"
                id="username"
                class="form-input"
                placeholder="Enter username"
                autocomplete="username"
                spellcheck="false"
              />
              <div class="input-border"></div>
              <div class="input-glow"></div>
            </div>
            <span class="form-error" id="usernameError"></span>
          </div>

          <!-- Password -->
          <div class="form-group" id="passwordGroup">
            <label class="form-label" for="password">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                <rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="2"/>
              </svg>
              Password
            </label>
            <div class="input-wrapper">
              <input
                type="password"
                id="password"
                class="form-input"
                placeholder="Enter password"
                autocomplete="current-password"
              />
              <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                <svg class="eye-icon eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2"/>
                  <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
                </svg>
                <svg class="eye-icon eye-closed hidden" width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" stroke="currentColor" stroke-width="2"/>
                  <line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2"/>
                </svg>
              </button>
              <div class="input-border"></div>
              <div class="input-glow"></div>
            </div>
            <span class="form-error" id="passwordError"></span>
          </div>

          <!-- Remember me -->
          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox" id="rememberMe" class="checkbox-input" />
              <span class="checkbox-custom"></span>
              Remember me
            </label>
          </div>

          <!-- Submit button -->
          <button type="submit" class="btn-login" id="loginBtn">
            <span class="btn-text">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" stroke="currentColor" stroke-width="2"/>
                <polyline points="10 17 15 12 10 7" stroke="currentColor" stroke-width="2"/>
                <line x1="15" y1="12" x2="3" y2="12" stroke="currentColor" stroke-width="2"/>
              </svg>
              Enter Portfolio
            </span>
            <span class="btn-loader hidden">
              <span class="loader-dot"></span>
              <span class="loader-dot"></span>
              <span class="loader-dot"></span>
            </span>
            <div class="btn-shimmer"></div>
          </button>
        </form>

        <!-- Demo hint -->
        <div class="demo-hint">
          <span class="hint-label">// Demo credentials</span>
          <div class="hint-creds">
            <span>user: <code>admin</code></span>
            <span>pass: <code>portfolio2025</code></span>
          </div>
        </div>
      </div>

      <!-- Scan line effect -->
      <div class="card-scanline"></div>
    </div>

  </main>

  <!-- Corner decorations -->
  <div class="corner-deco corner-tl"></div>
  <div class="corner-deco corner-br"></div>

  <script src="js/login.js"></script>
</body>
</html>
